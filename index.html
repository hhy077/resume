    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
    :root {
      --glow-cyan: rgba(6,182,212,0.18);
      --glow-indigo: rgba(99,102,241,0.16);
    }
    html.dark {
      --glow-cyan: rgba(34,211,238,0.22);
      --glow-indigo: rgba(129,140,248,0.20);
    }

    /* Day theme base */
    html:not(.dark) body {

      color: #334155;
    }
    html.dark body {
      background: #030712;
      color: #cbd5e1;
    }
    html:not(.dark) .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

    }

      border-color: rgba(6, 182, 212, 0.35);
      box-shadow: 0 16px 40px -10px rgba(6, 182, 212, 0.12);
    }
    html:not(.dark) .text-gradient {
      background: linear-gradient(135deg, #0891b2 0%, #4f46e5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    html:not(.dark) .glow-cyan {
      background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);

    }
    html:not(.dark) .glow-indigo {
      background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%);
      filter: blur(100px);
    }

    /* Night theme */
    html.dark .glass {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 4px 24px -6px rgba(0, 0, 0, 0.3);
    }
    html.dark .glass:hover {
      border-color: rgba(34, 211, 238, 0.35);
      box-shadow: 0 16px 40px -10px rgba(6, 182, 212, 0.14);
    }
    html.dark .text-gradient {
      background: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    html.dark .glow-cyan {
      background: radial-gradient(circle, rgba(34,211,238,0.35) 0%, transparent 65%);
      filter: blur(120px);
    }
    html.dark .glow-indigo {
      background: radial-gradient(circle, rgba(129,140,248,0.30) 0%, transparent 65%);
      filter: blur(120px);
    }

    .progress-fill {
      background: linear-gradient(90deg, #06b6d4, #6366f1);
    }
    html:not(.dark) .progress-fill {
      background: linear-gradient(90deg, #0891b2, #4f46e5);
    }

    .btn-glow {
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    html.dark .btn-glow:hover {
      box-shadow: 0 0 26px rgba(34, 211, 238, 0.35);
    }
    html:not(.dark) .btn-glow:hover {
      box-shadow: 0 0 26px rgba(8, 145, 178, 0.25);
    }

    .card-hover {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
    }

    /* Entrance animations */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-left {
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-scale {
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .reveal-scale.visible { opacity: 1; transform: scale(1); }

    .stagger-1 { transition-delay: 0.08s; }
    .stagger-2 { transition-delay: 0.16s; }
    .stagger-3 { transition-delay: 0.24s; }
    .stagger-4 { transition-delay: 0.32s; }
    .stagger-5 { transition-delay: 0.40s; }

    /* Hero special entrance */
    .hero-avatar {
      opacity: 0;
      transform: scale(0.8) rotate(-8deg);
      animation: avatarIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes avatarIn {
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    .hero-title {
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }
    .hero-sub {
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
    }
    .hero-text {
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.40s forwards;
    }
    .hero-actions {
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.52s forwards;
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating glows */
    .glow-cyan, .glow-indigo {
      transition: opacity 1s ease, transform 8s ease-in-out;
    }

    /* Shooting star */
    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-15deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(-110vw) translateY(40vh) rotate(-15deg); opacity: 0; }
    }
    html.dark #shooting-star {
      animation: shoot 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      animation-delay: 1.2s;
      opacity: 1;
    }
    html:not(.dark) #shooting-star {
      animation: none;
      opacity: 0;
    }

    /* Star field */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }
    html.dark .stars {
      opacity: 1;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 160px 120px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 230px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 380px 60px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 450px 110px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 520px 40px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 600px 90px, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 680px 160px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 750px 50px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 820px 130px, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 900px 70px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 980px 140px, rgba(255,255,255,0.7), transparent);
      background-size: 1000px 200px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media print {
      html.dark, html:not(.dark) { background: #fff !important; color: #0f172a !important; }
      .no-print, .nav, .back-top, .glow { display: none !important; }
      .glass { background: #fff !important; border-color: #e2e8f0 !important; box-shadow: none !important; }
      .text-white, .text-slate-900, .text-slate-200 { color: #0f172a !important; }
      .text-slate-300, .text-slate-400, .text-slate-500 { color: #334155 !important; }
      .text-cyan-400 { color: #0891b2 !important; }
      .reveal, .reveal-left, .reveal-scale { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

          id="${tid}-${i}" role="tab" aria-selected="${i === 0}" aria-controls="${containerPrefix}-panel-${i}" tabindex="${i === 0 ? 0 : -1}">
          ${t.icon ? `<i data-lucide="${t.icon}" class="w-4 h-4 inline-block align-text-bottom mr-1"></i>` : ''}${escape(t.label[lang])}
        </button>
      `).join('');
      panels.innerHTML = tabData.map((t, i) => `
        <div class="tab-panel ${i === 0 ? 'block' : 'hidden'}" id="${containerPrefix}-panel-${i}" role="tabpanel" aria-labelledby="${tid}-${i}"></div>
      `).join('');

      const tabEls = [...tabs.querySelectorAll('[role="tab"]')];
      const panelEls = [...panels.querySelectorAll('[role="tabpanel"]')];

      function updateTabStyle(el, active) {
        el.className = active
          ? 'tab px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-cyan-500/15 text-cyan-600 dark:text-cyan-400 border border-cyan-500/30'
          : `tab px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 ${isDark ? 'text-slate-400 hover:text-white hover:bg-white/5' : 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'}`;
      }

      function activate(idx) {
        tabEls.forEach((el, i) => {
          const active = i === idx;
          el.setAttribute('aria-selected', active);
          el.setAttribute('tabindex', active ? 0 : -1);
          updateTabStyle(el, active);
        });
        panelEls.forEach((el, i) => el.classList.toggle('hidden', i !== idx));
        renderPanel(panelData[idx] || [], panelEls[idx]);
        lucide.createIcons();
      }

      tabEls.forEach((el, i) => {
        el.addEventListener('click', () => { activate(i); el.focus(); });
        el.addEventListener('keydown', e => {
          let ni = i;
          if (e.key === 'ArrowRight') ni = (i + 1) % tabEls.length;
          else if (e.key === 'ArrowLeft') ni = (i - 1 + tabEls.length) % tabEls.length;
          else if (e.key === 'Home') ni = 0;
          else if (e.key === 'End') ni = tabEls.length - 1;
          else return;
          e.preventDefault();
          activate(ni);
          tabEls[ni].focus();
        });
      });
      activate(0);
    }

          entry.target.classList.add('visible');
          // Animate numbers inside
          const nums = entry.target.querySelectorAll('[data-target]');
          nums.forEach(n => animateNumber(n));
          const bars = entry.target.querySelectorAll('.skill-bar');
          bars.forEach(b => setTimeout(() => b.style.width = b.dataset.w + '%', 200));
        }
      });
    }, observerOptions);

    function animateNumber(el) {
      const target = el.dataset.target;
      if (!target) return;
      const isPlus = target.includes('+');
      const isPercent = target.includes('%');
      const num = parseFloat(target.replace(/[^0-9.]/g, ''));
      if (isNaN(num)) {
        el.textContent = target;
        return;
      }
      const dur = 1200;
      const start = performance.now();
      function step(now) {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const cur = Math.round(num * eased * 10) / 10;
        let text = Number.isInteger(num) ? Math.round(cur) : cur.toFixed(1);
        if (isPercent) text += '%';
        if (isPlus && p === 1) text += '+';
        el.textContent = text;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function refreshReveal() {
      document.querySelectorAll('.reveal, .reveal-left, .reveal-scale').forEach(el => {
        revealObserver.observe(el);
      });
    }

    function initTheme() {
      const saved = localStorage.getItem('resume_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      isDark = saved ? saved === 'dark' : prefersDark;
      applyThemeStyles();

      $('theme-btn').addEventListener('click', () => {
        isDark = !isDark;
        localStorage.setItem('resume_theme', isDark ? 'dark' : 'light');
        applyThemeStyles();
        // Re-render components that depend on isDark
        renderExperience(); renderProjects(); renderSkills(); renderEducation();
        lucide.createIcons();
        refreshReveal();
      });
    }

    function init() {
      initTheme();
      $('year').textContent = new Date().getFullYear();
      $('update').textContent = new Date().toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US');
      $('print-btn').addEventListener('click', () => window.print());
      $('lang-btn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('resume_lang', lang); applyLang(); });
      $('menu-btn').addEventListener('click', () => $('mobile-menu').classList.toggle('hidden'));
      document.querySelectorAll('#mobile-menu a').forEach(a => a.addEventListener('click', () => $('mobile-menu').classList.add('hidden')));

      renderHero(); renderHighlights(); renderExperience(); renderProjects(); renderSkills(); renderEducation();
      lucide.createIcons();
      refreshReveal();

      // Back to top
      window.addEventListener('scroll', () => {
        $('back-top').classList.toggle('opacity-0', window.scrollY <= 300);
        $('back-top').classList.toggle('pointer-events-none', window.scrollY <= 300);
        // Nav shadow on scroll
        $('navbar').classList.toggle('shadow-lg', window.scrollY > 10);
      }, { passive: true });
      $('back-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    init();
  </script>
</body>
</html>
