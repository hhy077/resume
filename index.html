        { icon: 'phone', text: c.phone },
        { icon: 'mail', text: email },
        { icon: 'zap', text: lang === 'zh' ? 'AI 应用' : 'AI Apps' },
        { icon: 'bot', text: lang === 'zh' ? '智能体' : 'Agents' },
        { icon: 'code-2', text: lang === 'zh' ? '前端开发' : 'Frontend' }
      ];
      $('hero-badges').innerHTML = badges.map(b => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full glass text-xs font-medium text-slate-300 border border-white/10">
          <i data-lucide="${b.icon}" class="w-3.5 h-3.5 text-cyan-400"></i>${escape(b.text)}
        </span>
      `).join('');
    }

    function renderHighlights() {
      $('highlights-grid').innerHTML = resume.highlights.map(h => `
        <div class="hl-card glass rounded-2xl p-5 card-hover cursor-default">
          <div class="hl-num text-3xl md:text-4xl font-extrabold text-gradient mb-1 transition-all duration-300">${escape(h.num)}</div>
          <div class="text-sm font-semibold text-slate-200 mb-0.5">${escape(lang === 'en' && h.labelEn ? h.labelEn : h.label)}</div>
          <div class="text-xs text-slate-500">${escape(lang === 'en' && h.descEn ? h.descEn : h.desc)}</div>
        </div>
      `).join('');
    }

    function buildTabSystem({ tabs, panels, tabData, panelData, renderPanel, containerPrefix }) {
      if (!tabData || tabData.length === 0) {
        tabs.closest('section').classList.add('hidden');
        return;
      }
      const tid = containerPrefix + '-tab';
      tabs.innerHTML = tabData.map((t, i) => `
        <button class="tab px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 ${i === 0 ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:text-white hover:bg-white/5'}"
          id="${tid}-${i}" role="tab" aria-selected="${i === 0}" aria-controls="${containerPrefix}-panel-${i}" tabindex="${i === 0 ? 0 : -1}">
          ${t.icon ? `<i data-lucide="${t.icon}" class="w-4 h-4 inline-block align-text-bottom mr-1"></i>` : ''}${escape(t.label[lang])}
        </button>
      `).join('');
      panels.innerHTML = tabData.map((t, i) => `
        <div class="tab-panel ${i === 0 ? 'block' : 'hidden'}" id="${containerPrefix}-panel-${i}" role="tabpanel" aria-labelledby="${tid}-${i}"></div>
      `).join('');

      const tabEls = [...tabs.querySelectorAll('[role="tab"]')];
      const panelEls = [...panels.querySelectorAll('[role="tabpanel"]')];

      function activate(idx) {
        tabEls.forEach((el, i) => {
          const active = i === idx;
          el.setAttribute('aria-selected', active);
          el.setAttribute('tabindex', active ? 0 : -1);
          el.className = active
            ? 'tab px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-cyan-500/15 text-cyan-400 border border-cyan-500/30'
            : 'tab px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white hover:bg-white/5';
          const iconName = tabData[i].icon;
          if (iconName) {
            el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 inline-block align-text-bottom mr-1"></i>${escape(tabData[i].label[lang])}`;
          } else {
            el.textContent = tabData[i].label[lang];
          }
        });
        panelEls.forEach((el, i) => el.classList.toggle('hidden', i !== idx));
        renderPanel(panelData[idx] || [], panelEls[idx]);
        lucide.createIcons();
      }

      tabEls.forEach((el, i) => {
        el.addEventListener('click', () => { activate(i); el.focus(); });
        el.addEventListener('keydown', e => {
          let ni = i;
          if (e.key === 'ArrowRight') ni = (i + 1) % tabEls.length;
          else if (e.key === 'ArrowLeft') ni = (i - 1 + tabEls.length) % tabEls.length;
          else if (e.key === 'Home') ni = 0;
          else if (e.key === 'End') ni = tabEls.length - 1;
          else return;
          e.preventDefault();
          activate(ni);
          tabEls[ni].focus();
        });
      });
      activate(0);
    }

    function renderExperience() {
      const data = resume.experience.filter(g => g.items && g.items.length);
      if (data.length === 0) {
        $('experience').classList.add('hidden');
        return;
      }
      buildTabSystem({
        tabs: $('exp-tabs'), panels: $('exp-panels'),
        tabData: data, panelData: data.map(g => g.items),
        containerPrefix: 'exp',
        renderPanel(items, panel) {
          panel.innerHTML = `
            <div class="relative border-l border-white/10 ml-3 md:ml-4 pl-6 md:pl-8 space-y-6">
              ${items.map((item, idx) => `
                <article class="relative glass rounded-2xl p-5 md:p-6 card-hover">
                  <span class="absolute -left-[31px] md:-left-[39px] top-7 w-3 h-3 rounded-full bg-cyan-400 ring-4 ring-slate-950"></span>
                  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-2 mb-3">
                    <div>
                      <h3 class="text-lg font-bold text-white">${escape(item.title)}</h3>
                      <p class="text-sm text-cyan-400 font-semibold">${escape(item.subtitle)}</p>
                    </div>
                    <span class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 bg-white/5 px-2.5 py-1 rounded-lg whitespace-nowrap">
                      <i data-lucide="calendar" class="w-3.5 h-3.5"></i>${escape(item.date)}
                    </span>
                  </div>
                  <ul class="space-y-2">
                    ${item.points.map(p => `
                      <li class="text-sm text-slate-400 leading-relaxed flex gap-2">
                        <span class="text-cyan-400 mt-1.5 w-1.5 h-1.5 rounded-full bg-cyan-400 shrink-0"></span>
                        <span>${escape(p)}</span>
                      </li>
                    `).join('')}
                  </ul>
                </article>
              `).join('')}
            </div>
          `;
        }
      });
    }

    function renderProjects() {
      const data = resume.projects;
      const projectData = data.map(cat => {
        const list = cat.id === 'all'
          ? resume.projectList
          : resume.projectList.filter(p => p.category === cat.id);
        return { ...cat, list };
      }).filter(cat => cat.list.length);

      if (projectData.length === 0) {
        $('projects').classList.add('hidden');
        return;
      }
      buildTabSystem({
        tabs: $('project-tabs'), panels: $('project-panels'),
        tabData: projectData, panelData: projectData.map(g => g.list),
        containerPrefix: 'project',
        renderPanel(items, panel) {
          panel.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">${items.map(p => `
            <article class="glass rounded-2xl p-5 md:p-6 card-hover flex flex-col h-full">
              <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
                    <i data-lucide="${p.icon}" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-base font-bold text-white">${escape(p.title)}</h3>
                    <p class="text-xs text-cyan-400 font-semibold">${escape(p.role)}</p>
                  </div>
                </div>
                <span class="text-xs text-slate-500 font-medium whitespace-nowrap">${escape(p.date)}</span>
              </div>
              <ul class="space-y-2 flex-1 mb-4">
                ${p.points.map(pt => `
                  <li class="text-sm text-slate-400 leading-relaxed flex gap-2">
                    <span class="text-cyan-400 mt-1.5 w-1.5 h-1.5 rounded-full bg-cyan-400 shrink-0"></span>
                    <span>${escape(pt)}</span>
                  </li>
                `).join('')}
              </ul>
              <div class="flex flex-wrap gap-2 mt-auto">
                ${p.tags.map(t => `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-cyan-500/10 border border-cyan-500/20 text-cyan-300">${escape(t)}</span>`).join('')}
              </div>
            </article>
          `).join('')}</div>`;
        }
      });
    }

    function renderSkills() {
      $('skill-grid').innerHTML = resume.skills.map(g => `
        <div class="glass rounded-2xl p-5 md:p-6 card-hover">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
              <i data-lucide="${g.icon}" class="w-4 h-4"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider">${escape(lang === 'en' && g.categoryEn ? g.categoryEn : g.category)}</h3>
          </div>
          ${g.type === 'bar' ? `<div class="space-y-4">${g.items.map(i => `
            <div>
              <div class="flex justify-between text-sm mb-1.5">
                <span class="text-slate-300 font-medium">${escape(i.name)}</span>
                <span class="text-cyan-400 font-semibold">${i.level}%</span>
              </div>
              <div class="h-2 bg-white/5 rounded-full overflow-hidden border border-white/5">
                <div class="progress-fill h-full rounded-full" style="width:0%" data-w="${i.level}"></div>
              </div>
            </div>
          `).join('')}</div>` : `<div class="flex flex-wrap gap-2">${g.items.map(i => `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-cyan-500/10 border border-cyan-500/20 text-cyan-300"><i data-lucide="check" class="w-3 h-3"></i>${escape(i)}</span>`).join('')}</div>`}
        </div>
      `).join('');
      setTimeout(() => {
        document.querySelectorAll('.progress-fill').forEach(el => el.style.width = el.dataset.w + '%');
      }, 120);
    }

    function renderEducation() {
      const e = resume.education;
      let details = [];
      if (e.courses) details.push(`<span class="inline-flex items-center gap-1"><i data-lucide="book-marked" class="w-3.5 h-3.5 text-cyan-400"></i>${escape(e.courses)}</span>`);
      if (e.gpa) details.push(`GPA: ${escape(e.gpa)}`);
      if (e.note) details.push(`<span class="inline-flex items-center gap-1"><i data-lucide="lightbulb" class="w-3.5 h-3.5 text-cyan-400"></i>${escape(e.note)}</span>`);
      $('edu-card').innerHTML = `
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3 mb-3">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
              <i data-lucide="graduation-cap" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="text-xl font-extrabold text-white">${escape(e.school)}</h3>
              <p class="text-sm text-cyan-400 font-semibold">${escape(e.major)}</p>
            </div>
          </div>
          <span class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 bg-white/5 px-3 py-1.5 rounded-lg whitespace-nowrap self-start">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>${escape(e.date)}
          </span>
        </div>
        ${details.length ? `<div class="space-y-2 text-sm text-slate-400 mt-4">${details.map(d => `<div>${d}</div>`).join('')}</div>` : ''}
      `;
      $('cert-list').innerHTML = resume.certificates.map(c => `
        <div class="glass rounded-2xl p-4 flex items-center gap-4 card-hover">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-cyan-500/20 to-indigo-500/20 border border-cyan-500/20 flex items-center justify-center text-cyan-400 shrink-0">
            <i data-lucide="award" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <div class="text-sm font-bold text-slate-200 truncate">${escape(c.name)}</div>
            <div class="text-xs text-slate-500">${escape(c.date)}</div>
          </div>
        </div>
      `).join('');
    }

    function copy(text) {
      navigator.clipboard.writeText(text).then(() => showToast(resume[lang].copied)).catch(() => {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); showToast(resume[lang].copied);
      });
    }
    function showToast(msg) {
      const t = $('toast'); $('toast-msg').textContent = msg;
      t.classList.remove('opacity-0', 'translate-y-3');
      setTimeout(() => t.classList.add('opacity-0', 'translate-y-3'), 2200);
    }

    function applyLang() {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      $('lang-btn').textContent = lang === 'zh' ? '中' : 'En';
      renderHero(); renderExperience(); renderProjects(); renderSkills(); renderEducation();
      lucide.createIcons();
    }

    function initTheme() {
      const saved = localStorage.getItem('resume_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
      $('theme-btn').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('resume_theme', isDark ? 'dark' : 'light');
      });
    }

    function init() {
      initTheme();
      $('year').textContent = new Date().getFullYear();
      $('update').textContent = new Date().toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US');
      $('print-btn').addEventListener('click', () => window.print());
      $('lang-btn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('resume_lang', lang); applyLang(); });
      $('menu-btn').addEventListener('click', () => $('mobile-menu').classList.toggle('hidden'));
      document.querySelectorAll('#mobile-menu a').forEach(a => a.addEventListener('click', () => $('mobile-menu').classList.add('hidden')));

      renderHero(); renderHighlights(); renderExperience(); renderProjects(); renderSkills(); renderEducation();
      lucide.createIcons();

      window.addEventListener('scroll', () => {
        $('back-top').classList.toggle('opacity-0', window.scrollY <= 300);
        $('back-top').classList.toggle('pointer-events-none', window.scrollY <= 300);
      }, { passive: true });
      $('back-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    init();
  </script>
</body>
</html>
